{% load i18n %}
<div class="overflow-x-auto">
<table class="w-full text-sm" data-testid="permission-matrix">
  <thead>
    <tr class="text-left text-base-500">
      <th class="py-1 pr-4 font-medium"></th>
      {% for code, label in widget.actions %}<th class="py-1 pr-4 font-medium text-center">{{ label }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in widget.rows %}
    <tr class="border-t border-base-200 dark:border-base-800">
      <td class="py-2 pr-4 font-medium">{{ row.label }}</td>
      {% for cell in row.cells %}
      <td class="py-2 pr-4 text-center">
        {% if cell.offered %}<input type="checkbox" name="{{ cell.name }}" value="1" {% if cell.checked %}checked{% endif %} class="w-4 h-4"{% if cell.hint %} title="{{ cell.hint }}"{% endif %}>{% else %}<span class="text-base-300">—</span>{% endif %}
      </td>
      {% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
